<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Restaurante — Iniciar sesión</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-screen">
    <div class="login-brand">
      <div class="mark">Restaurante</div>
      <p class="tagline">Panel interno de ventas, inventario y finanzas.</p>
    </div>
    <div class="login-form-side">
      <form class="login-form" id="form-login">
        <h2>Iniciar sesión</h2>
        <p class="sub">Ingresa con tu cuenta de administrador o empleado.</p>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="username">
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn-primary" style="width:100%;">Ingresar</button>
        <p class="error-text" id="error-msg"></p>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('error-msg');
      errorMsg.textContent = '';
      try {
        const res = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        if (!res.ok) {
          errorMsg.textContent = 'Credenciales inválidas';
          return;
        }
        const data = await res.json();
        guardarSesion(data.access_token, data.rol);
        window.location.href = 'dashboard.html';
      } catch (err) {
        errorMsg.textContent = 'No se pudo conectar con el servidor';
      }
    });
  </script>
</body>
</html>
